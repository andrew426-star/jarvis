# One service: the Docker image holds the built console and the API, and
# uvicorn serves both off a single port. See Dockerfile.
#
# NOTE: the live srv-daapqpegekts738ig3l0 service was created by hand in
# the dashboard, not from this file, so today this Blueprint is inert —
# Render ignores render.yaml for services it doesn't manage. It is kept
# as the source of truth for the intended shape (and the env-var list),
# and is what a from-scratch recreate should use.
services:
  - type: web
    name: jarvis
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Matches the live service. Free spins down when idle, so the first
    # request after a quiet period eats a ~50s cold start before the
    # console renders at all.
    plan: free
    region: oregon
    healthCheckPath: /health

    # sync: false means "prompt me, don't store it in git". Every key
    # below has no default in app/core/config.py, so the app will not
    # boot until all of them are set.
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_STATE_SECRET
        sync: false

      # Host-dependent: must be this service's own Render URL, and the
      # same string must be registered in the Google Cloud console.
      # Carrying the old Railway value over will fail the OAuth callback.
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # Sign-in. Its own redirect URI, separate from the connect flow's
      # above, and registered alongside it in the Google Cloud console:
      #   https://<this-service>.onrender.com/auth/login/callback
      - key: GOOGLE_LOGIN_REDIRECT_URI
        sync: false
      # Comma-separated addresses allowed to sign in. Unset = nobody,
      # which locks the console (see app/core/session.py).
      - key: JARVIS_ALLOWED_EMAILS
        sync: false
      # openssl rand -hex 32. Rotating it signs everyone out.
      - key: JARVIS_SESSION_SECRET
        sync: false

      # No longer typed into the console (Google sign-in replaced that),
      # but still the credential curl and scripts use, and the escape
      # hatch if sign-in is ever misconfigured. Drop it to close that
      # path entirely.
      - key: JARVIS_ACCESS_TOKEN
        sync: false

    # Deliberately not listed, because they have defaults or are genuinely
    # optional — add them in the Render dashboard if you want the feature:
    #   ELEVENLABS_API_KEY / ELEVENLABS_VOICE_ID    -> /speak
    #   SPOTIFY_CLIENT_ID / _SECRET / _REDIRECT_URI / _OAUTH_STATE_SECRET
    #   ZOHO_CLIENT_ID / _SECRET / _REDIRECT_URI / _OAUTH_STATE_SECRET
    # The two REDIRECT_URIs above are host-dependent in the same way
    # GOOGLE_REDIRECT_URI is.
    #
    # JARVIS_FRONTEND_ORIGIN stays absent in production, where the console
    # is same-origin and sign-in redirects to a bare "/". It is not dead,
    # though: `next dev` needs it set to http://localhost:3000 so sign-in
    # lands back on the HMR server instead of on the API.
