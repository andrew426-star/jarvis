name: Jarvis routines

# Manual runs of Jarvis's routines (morning brief, evening check-in, weekly
# review). The schedule itself moved to Supabase pg_cron
# (supabase/migrations/0006_jarvis_routine_scheduler.sql): GitHub started
# scheduled runs hours late. Leaving a GitHub schedule here as well would
# let both fire the same slot at once.
on:
  workflow_dispatch:
    inputs:
      routine:
        description: Routine to run now
        required: true
        type: choice
        options:
          - morning-brief
          - evening-checkin
          - weekly-review

jobs:
  run-routine:
    runs-on: ubuntu-latest
    steps:
      - name: Run ${{ inputs.routine }}
        run: |
          # The free Render instance may be asleep: long timeout, one retry
          # (the route won't send twice in a day).
          curl --fail-with-body --retry 2 --retry-delay 30 --max-time 240 -X POST \
            -H "Authorization: Bearer ${{ secrets.JARVIS_ACCESS_TOKEN }}" \
            https://jarvis-u49p.onrender.com/routines/${{ inputs.routine }}/run
