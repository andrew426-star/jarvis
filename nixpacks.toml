# Jarvis builds two things but ships one process. Node exists only at
# build time, to turn web/ into the static bundle at web/out/; at runtime
# it is uvicorn alone, serving both the API and that bundle (app/main.py).
#
# Nixpacks auto-detects Python from requirements.txt but not Node, since
# package.json lives under web/ rather than at the root — hence this file.
# "..." keeps the auto-detected Python packages and appends Node to them.

[phases.setup]
nixPkgs = ["...", "nodejs_22"]

[phases.build]
cmds = [
  "npm ci --prefix web",
  "npm run build --prefix web",
]
