<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standby</title>
<style>
  @font-face { font-family: "JetBrains Mono"; src: url("../shared/jetbrains-mono-400.woff") format("woff"); }
  html, body { margin: 0; height: 100%; background: #050508; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
// STANDBY - the lock screen. Jarvis's core, with Kivaro's mark as its
// reactor, breathing in the lower half. The top third is left dark for the
// clock iOS draws there, and the bottom edge for its two buttons.
import { COLORS, FONT, arcRing, drawMark, hexGrid, orbiters, ringLabels, run, sphere, tickRing, wave } from "../shared/hud.js"

const PERIOD = 8

function draw(ctx, w, h, t) {
  const u = w / 1290 // the design is drawn at 1290 x 2796, an iPhone Pro Max
  const cx = w / 2
  const cy = h * 0.6
  const R = Math.min(w * 0.3, h * 0.15) // the outer ring and labels stay inside the edges
  const breath = wave(t, PERIOD, 1) * 0.5 + 0.5

  // Ground: near black, warming toward the core.
  ctx.fillStyle = COLORS.ink
  ctx.fillRect(0, 0, w, h)
  const glow = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 3.2)
  glow.addColorStop(0, `rgba(${COLORS.cyanRGB}, ${0.1 + 0.04 * breath})`)
  glow.addColorStop(0.35, `rgba(${COLORS.greenRGB}, 0.025)`)
  glow.addColorStop(1, "rgba(0, 0, 0, 0)")
  ctx.fillStyle = glow
  ctx.fillRect(0, 0, w, h)

  // The grid stays out of the clock's third.
  hexGrid(ctx, w, h, 46 * u, t, PERIOD, { top: h * 0.36, base: 0.03, band: 0.09 })
  const fade = ctx.createLinearGradient(0, h * 0.34, 0, h * 0.46)
  fade.addColorStop(0, COLORS.ink)
  fade.addColorStop(1, "rgba(5, 5, 8, 0)")
  ctx.fillStyle = fade
  ctx.fillRect(0, h * 0.3, w, h * 0.16)

  // The core.
  sphere(ctx, cx, cy, R, t, PERIOD, { turns: 1, alpha: 0.42 })
  tickRing(ctx, cx, cy, R * 1.16, t, PERIOD, { ticks: 120, turns: 1, alpha: 0.55 })
  arcRing(ctx, cx, cy, R * 1.3, t, PERIOD, { n: 6, fill: 0.62, turns: -1, alpha: 0.55 })
  arcRing(ctx, cx, cy, R * 1.36, t, PERIOD, { n: 24, fill: 0.3, turns: 2, width: 0.006, alpha: 0.35 })
  arcRing(ctx, cx, cy, R * 1.48, t, PERIOD, { n: 3, fill: 0.18, turns: 1, width: 0.02, rgb: COLORS.greenRGB, alpha: 0.6 })
  ringLabels(ctx, cx, cy, R * 1.58, t, PERIOD, ["J.A.R.V.I.S.", "CORE", "KIVARO AI", "LINK", "STANDBY", "SYNC"], {
    size: 17 * u, alpha: 0.45,
  })
  orbiters(ctx, cx, cy, R * 1.16, t, PERIOD, { count: 2, turns: 1, size: 4 * u })
  orbiters(ctx, cx, cy, R * 1.48, t, PERIOD, { count: 3, turns: -1, size: 3.2 * u, rgb: COLORS.greenRGB })

  // The reactor: a disc of dark behind the mark, so the sphere's lines do
  // not run through it, and the mark breathing.
  const well = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.62)
  well.addColorStop(0, "rgba(5, 8, 6, 0.95)")
  well.addColorStop(1, "rgba(5, 8, 6, 0)")
  ctx.fillStyle = well
  ctx.beginPath()
  ctx.arc(cx, cy, R * 0.62, 0, Math.PI * 2)
  ctx.fill()
  ctx.strokeStyle = `rgba(${COLORS.cyanRGB}, ${0.35 + 0.25 * breath})`
  ctx.lineWidth = 2 * u
  ctx.beginPath()
  ctx.arc(cx, cy, R * 0.5, 0, Math.PI * 2)
  ctx.stroke()
  drawMark(ctx, cx, cy, R * 0.62, t, PERIOD, { glow: 0.55 + 0.45 * breath, waveCycles: 1 })

  // Signature, clear of the flashlight and camera buttons.
  ctx.textAlign = "center"
  ctx.textBaseline = "middle"
  ctx.font = `${30 * u}px ${FONT}`
  ctx.fillStyle = `rgba(${COLORS.cyanRGB}, 0.8)`
  ctx.letterSpacing = `${12 * u}px`
  ctx.fillText("J.A.R.V.I.S.", cx, h * 0.84)
  ctx.font = `${20 * u}px ${FONT}`
  ctx.letterSpacing = `${8 * u}px`
  ctx.fillStyle = `rgba(${COLORS.greenRGB}, 0.7)`
  ctx.fillText("KIVARO AI · STANDING BY", cx, h * 0.84 + 46 * u)
  ctx.letterSpacing = "0px"
}

run(draw, { width: 1290, height: 2796, period: PERIOD })
</script>
</body>
</html>
